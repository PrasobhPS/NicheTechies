  <!-- =========================================================================
       3. Full-Screen Interactive Lightbox Modal
       ========================================================================= -->
  <div class="gallery-lightbox" id="gallery-lightbox" role="dialog" aria-modal="true" aria-hidden="true"
    aria-label="Image Lightbox Viewer">
    <div class="gallery-lightbox-backdrop" id="lightbox-backdrop"></div>

    <button type="button" class="gallery-lightbox-close" id="lightbox-close" aria-label="Close image preview">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="gallery-lightbox-dialog" tabindex="-1">
      <div class="gallery-lightbox-figure">
        <img src="" alt="" class="gallery-lightbox-image" id="lightbox-image">
      </div>
      <div class="gallery-lightbox-bar">
        <div class="lightbox-info">
          <div class="lightbox-title text-base font-semibold text-white tracking-tight" id="lightbox-title">Photo</div>
          <div class="lightbox-sub text-xs text-slate-400 mt-0.5" id="lightbox-sub"></div>
        </div>
        <div class="lightbox-nav-btns">
          <button type="button" class="lightbox-nav-btn" id="lightbox-prev" aria-label="Previous photo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button type="button" class="lightbox-nav-btn" id="lightbox-next" aria-label="Next photo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
